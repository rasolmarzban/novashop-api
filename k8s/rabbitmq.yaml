apiVersion: apps/v1
kind: Deployment
metadata:
  name: novashop-rabbitmq
spec:
  replicas: 1

  selector:
    matchLabels:
      app: novashop-rabbitmq

  template:
    metadata:
      labels:
        app: novashop-rabbitmq

    spec:
      containers:
        - name: rabbitmq

          image: rabbitmq:3-management

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5672
              name: amqp

            - containerPort: 15672
              name: management

          env:
            - name: RABBITMQ_DEFAULT_USER
              value: 'novashop'

            - name: RABBITMQ_DEFAULT_PASS
              value: 'NovaShopApp@2026!'

          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'

            limits:
              memory: '512Mi'
              cpu: '500m'

          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq

      volumes:
        - name: rabbitmq-data
          persistentVolumeClaim:
            claimName: novashop-rabbitmq-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: novashop-rabbitmq
spec:
  selector:
    app: novashop-rabbitmq

  ports:
    - name: amqp
      port: 5672
      targetPort: 5672

    - name: management
      port: 15672
      targetPort: 15672

  type: ClusterIP
