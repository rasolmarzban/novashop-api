apiVersion: apps/v1
kind: Deployment
metadata:
  name: novashop-mysql
spec:
  replicas: 1

  selector:
    matchLabels:
      app: novashop-mysql

  template:
    metadata:
      labels:
        app: novashop-mysql

    spec:
      containers:
        - name: mysql
          image: mysql:8.4

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              value: 'novashop'

            - name: MYSQL_USER
              value: 'novashop_app'

            - name: MYSQL_PASSWORD
              value: 'NovaShopApp@2026!'

            - name: MYSQL_ROOT_PASSWORD
              value: 'root_password'

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

          resources:
            requests:
              memory: '256Mi'
              cpu: '250m'

            limits:
              memory: '512Mi'
              cpu: '500m'

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: novashop-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: novashop-mysql
spec:
  selector:
    app: novashop-mysql

  ports:
    - port: 3306
      targetPort: 3306

  type: ClusterIP
