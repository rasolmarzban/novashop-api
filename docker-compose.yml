services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: novashop-api

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

      rabbitmq:
        condition: service_started

  mysql:
    image: mysql:8.4

    container_name: novashop-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: novashop
      MYSQL_USER: novashop_app
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management

    container_name: novashop-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mysql_data: