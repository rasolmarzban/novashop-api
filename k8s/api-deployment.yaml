apiVersion: apps/v1
kind: Deployment

metadata:
  name: novashop-api

spec:
  replicas: 3

  selector:
    matchLabels:
      app: novashop-api

  template:
    metadata:
      labels:
        app: novashop-api

    spec:
      containers:
        - name: api
          image: novashop-api-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000

          env:
            - name: APP_VERSION
              value: 'v2'

          envFrom:
            - configMapRef:
                name: novashop-api-config
            - secretRef:
                name: novashop-api-secret

          resources:
            requests:
              cpu: '250m'
              memory: '256Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'

          volumeMounts:
            - name: product-uploads
              mountPath: /app/uploads

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

      volumes:
        - name: product-uploads
          persistentVolumeClaim:
            claimName: novashop-uploads-pvc
